name: Deploy Frontend
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**' 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Frontend to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            echo "📦 Pulling and Building Frontend..."
            cd /var/www/sarvatirthamayi_site/frontend
            git fetch --all
            git reset --hard origin/main
            npm install
            npm run build
            echo "✅ Frontend Deployment Completely Successful! (Backend was left untouched)"